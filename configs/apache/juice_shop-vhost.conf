# /etc/apache2/sites-available/juice_shop.conf
#
# TLS-terminating reverse proxy in front of the OWASP Juice Shop container.
# The app itself is bound to 127.0.0.1:3000 only — this vhost is the sole
# path in, so every request is inspected by ModSecurity before it reaches it.
#
# NOTE: an early draft of this vhost also proxied /premium to a secondary
# backend port (10000/tcp), which is what the WAF-bypass test in
# ARCHITECTURE.md exercises. That port is locked to loopback via iptables,
# not re-exposed here. This is the corrected, validated configuration.

<VirtualHost *:8443>
    ServerName juice_shop

    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/juice_shop.crt
    SSLCertificateKeyFile /etc/apache2/ssl/juice_shop.key

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog  ${APACHE_LOG_DIR}/juice_shop_error.log
    CustomLog ${APACHE_LOG_DIR}/juice_shop_access.log combined
</VirtualHost>
