# /etc/modsecurity/custom_rules.conf
#
# Exercise 4 — block direct access to the "About You" page at the WAF layer
# (application-layer prevention, phase 1 = as early as possible in the
# request lifecycle, before the request reaches the backend).

SecRule REQUEST_URI|REQUEST_FILENAME \
  "@rx (?i)(/about[-_]?you|/about|about-you|about_you)" \
  "id:10000030,phase:1,deny,log,status:403,\
  msg:'PREVENTION: About You access blocked'"
